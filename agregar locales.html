
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar local</title>

    <link rel="stylesheet" href="agregar locales.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>

    <header class="titulo">

        <a href="pagina principal.html">
            <img src="Logo.png" alt="logo" class="logo">
        </a>

        <h2>Agregar local</h2>

        <a href="mapa.html">
            <button class="boton-volver">
                Volver al mapa
            </button>
        </a>

    </header>

    <main class="contenedor">

        <section class="formulario">

            <div class="campo">
                <label for="nombre">Nombre del local</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="campo">
                <label for="direccion">Dirección del local</label>
                <input type="text" id="direccion" required>
            </div>

            <div class="campo">
                <label for="menu">Link del menú</label>
                <input type="url" id="menu">
            </div>

            <div class="subir-fotos">

                <label for="fotos" class="boton-fotos">
                    Subir foto/s
                    <img src="simbolodescarga.png" alt="simbolodescarga">
                </label>

                <input type="file" id="fotos" accept="image/*" multiple>

                <span id="nombre-fotos"></span>

            </div>

        </section>

        <section class="mapa">

            <div class="mapa-contenedor">

                <div id="mapaLocal"></div>

                <h2>Marca tu local en el mapa</h2>

            </div>

            <p id="estado-mapa"></p>

            <section class="categorias">

                <div class="opcionceliaco">

                    <input type="checkbox" id="celiaco" name="preferencias" value="celiaco">

                    <label for="celiaco">
                        <img src="celiacosimbolo.png" alt="Celíaco">
                        <div class="palabradesimbolo">Celíaco</div>
                    </label>

                </div>

                <div class="opcionveganismo">

                    <input type="checkbox" id="veganismo" name="preferencias" value="veganismo">

                    <label for="veganismo">
                        <img src="veganosimbolo.png" alt="Veganismo">
                        <div class="palabradesimbolo">Veganismo</div>
                    </label>

                </div>

                <div class="opcionvegetarianismo">

                    <input type="checkbox" id="vegetarianismo" name="preferencias" value="vegetarianismo">

                    <label for="vegetarianismo">
                        <img src="vegetarianosimbolo.png" alt="Vegetarianismo">
                        <div class="palabradesimbolo">Vegetarianismo</div>
                    </label>

                </div>

            </section>

        </section>

        <footer class="botonesdelfooter">

            <a href="mapa.html">
                <button class="Volver">
                    <h2>Volver al mapa</h2>
                </button>
            </a>

            <button class="boton-anadir">
                <h2>Añadir</h2>
            </button>

        </footer>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="agregar locales.js"></script>

</body>

</html>
