<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="iniciar sesion.css">
</head>
<body>
    <h1>Iniciar sesión</h1>

    <form id="loginForm">
        <input required type="text" id="usuario" placeholder="Email o nombre de usuario">
        <br><br>
        <input required type="password" id="password" placeholder="Contraseña">
        <br><br>
        <button type="submit">continuar</button>
    </form>

    <p id="mensaje"></p>

    <br>
    <a href=".html">
        <button>Volver</button>
    </a>
    <div class="logo">
        <img src="logo.png" alt="logo">
        <span>Comida Por <br> Gusto</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
