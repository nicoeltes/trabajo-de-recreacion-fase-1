<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida Por Gusto</title>
    <link rel="stylesheet" href="recetas.css">
</head>

<body>

    <header>
        <div class="zonedearriba">
            <a href="pagina principal.html">
                <img src="Logo.png" alt="logo" class="logo">
            </a>

            <section class="busqueda">
                <label for="busqueda"><b>Buscar receta</b></label>

                <div class="orden">
                    <input type="text" id="busqueda">

                    <button type="button" id="botonFiltros" class="botonFiltros">
                        <img src="iconodefiltros.png" alt="Filtros" class="iconodefiltros">
                    </button>

                    <div id="panelFiltros" class="panelFiltros">
                        <h3>Filtrar recetas</h3>

                        <label for="filtroCalificacion">Calificación:</label>
                        <select id="filtroCalificacion">
                            <option value="">Todas</option>
                            <option value="4">4 estrellas o más</option>
                            <option value="3">3 estrellas o más</option>
                            <option value="2">2 estrellas o más</option>
                        </select>

                        <label for="filtroRestriccion">Restricción alimentaria:</label>
                        <select id="filtroRestriccion">
                            <option value="">Todas</option>
                            <option value="celiaco">Celíacas</option>
                            <option value="vegano">Veganas</option>
                            <option value="vegetariano">Vegetarianas</option>
                        </select>

                        <button type="button" id="aplicarFiltros">
                            Aplicar filtros
                        </button>

                        <button type="button" id="limpiarFiltros">
                            Limpiar filtros
                        </button>
                    </div>
                </div>
            </section>

            <section class="agregar">
                <a href="agregar recetas.html">
                    <button><b> + Agregar receta</b></button>
                </a>
            </section>
        </div>
    </header>

    <main>
        <section id="zone">
        </section>
    </main>

    <script src="recetas.js"></script>

</body>
</html>
