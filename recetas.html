
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida Por Gusto</title>
    <link rel="stylesheet" href="recetas.css">
</head>

<body>

    <header>
        <div class="zonedearriba">
            <a href="pagina principal.html">
                <img src="Logo.png" alt="logo" class="logo">
            </a>

            <div class="espacioBuscador"></div>

            <div class="zonaBusqueda">

                <section class="busqueda">
                    <label for="busqueda"><b>Buscar receta</b></label>

                    <div class="orden">
                        <input type="text" id="busqueda">

                        <button type="button" id="botonFiltros" class="botonFiltros">
                            <img src="iconodefiltros.png" alt="Filtros" class="iconodefiltros">
                        </button>

                        <div id="panelFiltros" class="panelFiltros">

                            <div class="parteSuperiorFiltros">
                                <button type="button" id="cerrarFiltros" class="cerrarFiltros">
                                    ✕
                                </button>
                            </div>

                            <h3>Filtros</h3>

                            <div class="contenidoFiltros">

                                <details class="desplegableFiltro">
                                    <summary>Filtrar por calificación</summary>

                                    <div class="opcionesCalificacion">

                                        <label>
                                            <input type="checkbox" value="5">
                                            <span>★★★★★</span>
                                        </label>

                                        <label>
                                            <input type="checkbox" value="4">
                                            <span>★★★★☆</span>
                                        </label>

                                        <label>
                                            <input type="checkbox" value="3">
                                            <span>★★★☆☆</span>
                                        </label>

                                        <label>
                                            <input type="checkbox" value="2">
                                            <span>★★☆☆☆</span>
                                        </label>

                                        <label>
                                            <input type="checkbox" value="1">
                                            <span>★☆☆☆☆</span>
                                        </label>

                                    </div>
                                </details>

                                <details class="desplegableFiltro">
                                    <summary>Filtrar por restricción</summary>

                                    <div class="opcionesRestriccion">

                                        <label>
                                            <input type="checkbox" value="celiaco">
                                            <img src="celiacosimbolo.png" alt="Celíaco">
                                        </label>

                                        <label>
                                            <input type="checkbox" value="vegano">
                                            <img src="veganosimbolo.png" alt="Vegano">
                                        </label>

                                        <label>
                                            <input type="checkbox" value="vegetariano">
                                            <img src="vegetarianosimbolo.png" alt="Vegetariano">
                                        </label>

                                    </div>
                                </details>

                                <button type="button" id="limpiarFiltros">
                                    Eliminar filtros
                                </button>

                            </div>
                        </div>
                    </div>
                </section>

                <section class="agregar">
                    <a href="agregar recetas.html">
                        <button><b> + Agregar receta</b></button>
                    </a>
                </section>

            </div>
        </div>
    </header>

    <main>
        <section id="zone">
        </section>
    </main>

    <script src="recetas.js"></script>

</body>
</html>
