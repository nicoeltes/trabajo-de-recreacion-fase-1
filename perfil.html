<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <main class="elementopadre">
    <header class="nombredepestaña">
    <div class="zonedearriba">
    <a href="pagina principal.html" class="botonlogo">
    <img src="Logo.png" alt="logo" class="logo">
    </a>   
    <h2 class="titulo">Tu perfil</h2>
    <div class="espaciovacio"></div>
    </div>
    </header>
<section class="zoneinformacion">
    <header class="h1">
        <h1 class="texto">Informacion del perfil:</h1>
    </header>
    <div class="orden">
    <section class="Informacion">
        <div class="datos"><b>
        <article class="nombredeusuario">Nombre de usuario:</article>
        <br>
        <article class="correo">Correo electrónico:</article>
        <br>
        <article class="restriccion">Restriccion alimenticia:</article>
        <br>
        <article class="contraseña">
            Contraseña:
        
            <input type="password" id="password" value="" readonly>
        
            <button type="button" id="mostrarPassword">
                <img src="revelar inforacion.png"
                     alt="Mostrar contraseña"
                     class="revelarinformacionbtn">
            </button>
        </article>
        <br>
        </b>
        </div>
    </section>
    <a href="./cambiarcontraseña.html" class="btn-link">
            <button class="cambiarcontraseña"><b class="estilo">Cambiar contraseña</b></button>
        </a>
    </div>
</section>
    </main>
    <script src="perfil.js"></script>
</body>
</html>
