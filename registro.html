<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <h1>Crear cuenta</h1>

    <form id="registroForm">
        <input required type="text" id="usuario" placeholder="Nombre de usuario">
        <br><br>
        <input required type="password" id="password" placeholder="Contraseña">
        <br><br>
        <button type="submit">Registrarse</button>
    </form>

    <p id="mensaje"></p>

    <script>
        const form = document.getElementById('registroForm');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            // Traer usuarios ya guardados (o array vacío si no hay ninguno)
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            // Verificar si el usuario ya existe
            const yaExiste = usuarios.some(u => u.usuario === usuario);

            if (yaExiste) {
                mensaje.textContent = "Ese usuario ya existe.";
                mensaje.style.color = "red";
                return;
            }

            // Agregar el nuevo usuario al array
            usuarios.push({ usuario, password });

            // Guardar el array actualizado en localStorage
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            mensaje.textContent = "¡Usuario registrado con éxito!";
            mensaje.style.color = "green";

            form.reset(); // limpia el formulario
        });
    </script>
</body>
</html>
