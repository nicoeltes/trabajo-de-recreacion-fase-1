<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="crear cuenta.css">
</head>

<body>
    <main class="elementopadre">
        <header class="nombredepestaña">
            <section class="titulo">
                <h2>Crear cuenta</h2>
            </section>
        </header>
        <div class="contenido">
            <form id="loginForm">
                <div class="usuario"> 
                    <label for="usuario"><b>Usuario</b></label> 
                    <input required type="text" id="usuario" name="usuario"> </div>
                <div class="correoelectronico">
                    <label for="Email"><b>Correo electrónico</b></label> 
                    <input required type="email" id="Email" name="Email"> </div>
                <div class="contraseña"> 
                    <label for="password"><b>Contraseña</b></label> 
                    <input required type="password" id="password" name="password"> </div>
                <div class="confirmarcontraseña"> 
                    <label for="Confirmarpassword"><b>Confirmar contraseña</b></label>
                    <input required type="password" id="Confirmarpassword" name="Confirmarpassword"> </div>
            </form>
            <section class="preferencias">
                <h2 class="titulopreferencias"> Seleccione su condición: </h2>
                <div class="opciones">
                    <div class="opcionceliaco"> <input type="checkbox" id="celiaco" name="preferencias" value="celiaco">
                        <label for="celiaco"> <img src="celiacosimbolo.png" alt="Celíaco">
                            <div class="palabradesimbolo">Celíaco</div>
                        </label> </div>
                    <div class="opcionveganismo"> <input type="checkbox" id="veganismo" name="preferencias"
                            value="veganismo"> <label for="veganismo"> <img src="veganosimbolo.png" alt="Veganismo">
                            <div class="palabradesimbolo">Veganismo</div>
                        </label> </div>
                    <div class="opcionvegetarianismo"> <input type="checkbox" id="vegetarianismo" name="preferencias"
                            value="vegetarianismo"> <label for="vegetarianismo"> <img src="vegetarianosimbolo.png"
                                alt="Vegetarianismo">
                            <div class="palabradesimbolo">Vegetarianismo</div>
                        </label> </div>
                </div>
            </section>
        </div>
        <p id="mensaje"></p> <br> <a href="index.html"> 
            <footer class="zonebotones">
            <button type="button">Volver</button> </a>
             <button type="submit" form="loginForm" class="botoncrear"><b>Crear</b></button>
            </footer>
    </main>
    <script src="script.js"></script>
</body>

</html>
