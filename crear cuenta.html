<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="crear cuenta.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Crear cuenta</h1>

    <form id="crearCuentaForm">
        <!-- Campos de texto obligatorios -->
        <div>
            <input required type="text" id="usuario" placeholder="Email o nombre de usuario">
        </div>
        <div>
            <input required type="password" id="password" placeholder="Crear contraseña">
        </div>
        <div>
            <input required type="password" id="confirmarPassword" placeholder="Confirmar contraseña">
        </div>
    
        <p style="color: white; margin-bottom: 8px; font-weight: 500;">Preferencia alimenticia (Seleccioná al menos 1):</p>
        
        <!-- CAMBIO: Volvemos a 'checkbox' para permitir marcar 1, 2 o las 3 opciones a la vez -->
        <div>
            <input type="checkbox" id="vegano">
            <label for="vegano">Vegano</label>
        </div>
        <div>
            <input type="checkbox" id="celiaco">
            <label for="celiaco">Celíaco</label>
        </div>
        <div>
            <input type="checkbox" id="vegetariano">
            <label for="vegetariano">Vegetariano</label>   
        </div>

        <!-- Botón para procesar el formulario -->
        <button type="submit">Continuar</button>
    </form>
    
    <p id="mensaje"></p>

    <br>
    <a href="index.html">
        <button type="button">Volver</button>
    </a>

    <script>
        const form = document.getElementById('crearCuentaForm');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const confirmarPassword = document.getElementById('confirmarPassword').value;

            // CAMBIO: Leemos el estado (true/false) de cada checkbox
            const esVegano = document.getElementById('vegano').checked;
            const esCeliaco = document.getElementById('celiaco').checked;
            const esVegetariano = document.getElementById('vegetariano').checked;

            // CAMBIO: VALIDACIÓN OBLIGATORIA
            // Comprobamos que AL MENOS UNA de las 3 esté seleccionada. Si ninguna es true, frena el avance.
            if (!esVegano && !esCeliaco && !esVegetariano) {
                mensaje.textContent = "Debes seleccionar al menos una preferencia (Vegano, Celíaco o Vegetariano).";
                mensaje.style.color = "#ffdddd";
                return; // Corta la ejecución para que no avance
            }

            if (password !== confirmarPassword) {
                mensaje.textContent = "Las contraseñas no coinciden.";
                mensaje.style.color = "#ffdddd";
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

            const yaExiste = usuarios.some(u => u.usuario === usuario);
            if (yaExiste) {
                mensaje.textContent = "Ese usuario ya existe.";
                mensaje.style.color = "#ffdddd";
                return;
            }

            // CAMBIO: Guardamos las 3 opciones de forma independiente en el objeto
            usuarios.push({ 
                usuario, 
                password,
                vegano: esVegano,
                celiaco: esCeliaco,
                vegetariano: esVegetariano
            });
            
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            mensaje.textContent = "¡Cuenta creada con éxito! Redirigiendo...";
            mensaje.style.color = "white";

            setTimeout(() => {
                window.location.href = "pagina principal.html";
            }, 1000);
        });
    </script>
</body>
</html>
