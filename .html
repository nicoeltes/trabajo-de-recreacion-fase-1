<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion en comida por gusto</title>
    <link rel="stylesheet" href=".css">
</head>

<body>
    <aside class="iniciodesesion">
        <header class="nombredepestaña">
                <h2 class="titulo">Iniciar sesión</h2>
        </header>
       
        <form id="loginForm">
            <label for="Usuario o Email"><b>Usuario o Correo elctrónico</b></label>
            <input required type="text" id="usuario">
            <br><br>
            <label for="Contraseña"><b>Contraseña</b></label>
            <input required type="password" id="password">
            <br><br>
            <section class="crearcuenta">
                <p>¿No tenés una cuenta?
                    <a href="crear cuenta.html">Creá una nueva</a>
                </p>
            </section>
            <button class="botoncontinuar"><b>continuar</b></button>
        </form>
        <p id="mensaje"></p>
    </aside>
    <section class="zonelogo">
        <article class="logo">
            <img class="logo" src="./Component 2 (1).png" alt="Logo">
        </article>

        <section class="cuadradodelslogan">
            <article class="slogan">
                <b>Las mejores <br> comidas, según <br> tus necesidades.</b>
            </article>
        </section>
    </section>
    <script src=".js"></script>
</body>

</html>
