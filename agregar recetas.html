
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar receta</title>
    <link rel="stylesheet" href="agregar recetas.css">
</head>

<body>

    <header class="nombredepestaña">
        <a href="pagina principal.html">
            <img src="Logo.png" alt="Logo de Comida Por Gusto" class="logo">
        </a>

        <h1 class="titulo">Agregar receta</h1>

        <a href="recetas.html" class="volver">Volver</a>
    </header>

    <main>
        <form id="formularioReceta">

            <section class="datosReceta">
                <label for="nombre">Nombre de la receta</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="ingredientes">Ingredientes (enter para hacer listado)</label>
                <textarea id="ingredientes" name="ingredientes" required></textarea>

                <label for="instrucciones">Instrucciones (enter para hacer listado)</label>
                <textarea id="instrucciones" name="instrucciones" required></textarea>
            </section>

            <section class="zonaFotos">

                <label for="fotos" class="subirFotos">
                    <span id="textoFotos">Subir foto/s <img src="simbolodescarga.png" alt="simbolodescarga" class="simbolodescarga"></span>
                </label>

                <input type="file" id="fotos" name="fotos" accept="image/*" multiple>

                <div id="vistaFotos"></div>

                <section class="preferencias">

                    <h2 class="titulopreferencias">
                        <b>La receta es apta para:</b>
                    </h2>

                    <div class="opciones">

                        <div class="opcionceliaco">
                            <input type="checkbox" id="celiaco" name="preferencias" value="celiaco">
                            <label for="celiaco">
                                <img src="celiacosimbolo.png" alt="Celíaco">
                                <div class="palabradesimbolo">Celíaco</div>
                            </label>
                        </div>

                        <div class="opcionveganismo">
                            <input type="checkbox" id="veganismo" name="preferencias" value="veganismo">
                            <label for="veganismo">
                                <img src="veganosimbolo.png" alt="Veganismo">
                                <div class="palabradesimbolo">Veganismo</div>
                            </label>
                        </div>

                        <div class="opcionvegetarianismo">
                            <input type="checkbox" id="vegetarianismo" name="preferencias" value="vegetarianismo">
                            <label for="vegetarianismo">
                                <img src="vegetarianosimbolo.png" alt="Vegetarianismo">
                                <div class="palabradesimbolo">Vegetarianismo</div>
                            </label>
                        </div>

                    </div>
                </section>

            </section>

            <button type="submit" class="botonSubir">Subir receta</button>
            <p id="mensaje"></p>

        </form>
    </main>

    <script src="agregar recetas.js"></script>
</body>
</html>
