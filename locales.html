<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local</title>

    <link rel="stylesheet" href="locales.css">
</head>

<body>

    <header class="titulo">

        <a href="pagina principal.html">
            <img src="Logo.png" alt="logo" class="logo">
        </a>

        <h2 id="nombre-local">(Nombre del local)</h2>

        <a href="mapa.html">
            <button class="boton-volver">
                Volver al mapa
            </button>
        </a>

    </header>

    <main class="contenedor">

        <section class="columna-izquierda">

            <div class="caja caja-menu">
                <h3>Link del menú:</h3>
                <a id="link-menu" href="#" target="_blank" rel="noopener noreferrer">
                    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                </a>
            </div>

            <div class="caja caja-direccion">
                <h3>Dirección:</h3>
                <p id="direccion">XXXXXXXXXXXX</p>
            </div>

        </section>

        <section class="columna-derecha">

            <div class="caja caja-fotos" id="fotos">
                <h2>Foto/s</h2>
            </div>

            <h2 class="titulo-opciones">El menú tiene opciones para:</h2>

            <section class="categorias">

                <div class="opcion">
                    <input type="checkbox" id="celiaco" value="celiaco" disabled>
                    <label for="celiaco">
                        <img src="celiacosimbolo.png" alt="Celiaquía">
                        <div class="palabradesimbolo">Celiaquía</div>
                    </label>
                </div>

                <div class="opcion">
                    <input type="checkbox" id="veganismo" value="veganismo" disabled>
                    <label for="veganismo">
                        <img src="veganosimbolo.png" alt="Veganismo">
                        <div class="palabradesimbolo">Veganismo</div>
                    </label>
                </div>

                <div class="opcion">
                    <input type="checkbox" id="vegetarianismo" value="vegetarianismo" disabled>
                    <label for="vegetarianismo">
                        <img src="vegetarianosimbolo.png" alt="Vegetarianismo">
                        <div class="palabradesimbolo">Vegetarianismo</div>
                    </label>
                </div>

            </section>

        </section>

    </main>

    <script src="locales.js"></script>

</body>

</html>
